[package]
name = "delta-force-desktop"
version = "0.1.0"
description = "Shell Windows local do Delta Force CRM"
authors = ["Delta Force"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "delta_force_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "delta-force-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.6.1"

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.1", features = [] }
thiserror = "2.0.17"
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2.4.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
