name: Pull request checks

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Validate repository and local infrastructure definition
        run: just workspace-check

  api-quality:
    name: API — format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: extractions/setup-just@v2
      - run: just api-install
      - run: just api-format-check
      - run: just api-lint

  api-tests:
    name: API — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: extractions/setup-just@v2
      - run: just api-install
      - run: just api-test

  api-integration-sqlite:
    name: API — SQLite integration (obrigatório)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: extractions/setup-just@v2
      - run: just api-install
      - run: just api-test-integration-sqlite

  api-integration:
    name: API — PostgreSQL integration (legado, ADR 0003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: extractions/setup-just@v2
      - name: Create local integration environment
        run: cp .env.example .env
      - run: just api-install
      - name: Run PostgreSQL legacy integration with an explicit database URL
        env:
          DATABASE_URL: postgresql+psycopg://delta_force:change-me-local@localhost:5432/delta_force
        run: just api-test-integration

  web-quality:
    name: Web — format, lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: extractions/setup-just@v2
      - run: just web-install
      - run: just web-check
