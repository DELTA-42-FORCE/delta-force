[project]
name = "delta-force-windows-api-spike"
version = "0.1.0"
description = "Disposable Windows sidecar and SQLite proof for issue 43"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
]

[project.scripts]
delta-force-api-spike = "spike_runtime.sidecar:main"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike_runtime"]

[dependency-groups]
dev = [
  "black>=24.10,<26.0",
  "cryptography>=46.0,<47.0",
  "flake8>=7.1,<8.0",
  "httpx>=0.28,<1.0",
  "pyinstaller>=6.11,<7.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py312"]
