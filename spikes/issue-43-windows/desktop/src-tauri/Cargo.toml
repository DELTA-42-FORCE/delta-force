[package]
name = "delta-force-windows-architecture-spike"
version = "0.0.0"
description = "Disposable, non-distributable Windows architecture spike"
edition = "2024"
publish = false

[lib]
name = "delta_force_windows_architecture_spike"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
getrandom = "0.4.3"
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.20"
zeroize = { version = "1.9.0", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
